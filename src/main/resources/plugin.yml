name: Mirage
version: '${version}'
main: xyz.tofumc.Mirage
api-version: '1.21'
folia-supported: true
commands:
  mirage:
    description: Shows Mirage status and reloads its configuration.
    usage: /mirage <sync|pull|status|reload> [arguments]
    permission: mirage.command
permissions:
  mirage.command:
    description: Allows use of Mirage commands.
    default: op
